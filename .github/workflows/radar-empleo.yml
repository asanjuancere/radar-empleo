# Radar de empleo: se ejecuta solo de lunes a viernes en los servidores de GitHub (gratis).
name: Radar de empleo

on:
  schedule:
    - cron: "15 6 * * 1-5"   # 06:15 UTC = 08:15 en Madrid en verano
  workflow_dispatch: {}       # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write             # para guardar las métricas en datos/

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Pruebas
        run: python -m pytest -q tests
      - name: Ejecutar radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          PERFIL: ${{ secrets.PERFIL }}
          RUBRICA: ${{ secrets.RUBRICA }}
          DESCARTE_EXTRA: ${{ secrets.DESCARTE_EXTRA }}
        # Sin clave de Claude todavía -> modo demo (datos de ejemplo, sin coste)
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then python main.py --demo; else python main.py; fi
      - name: Guardar métricas
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add datos/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Radar: métricas $(date +%F)"
          git push
